services:
  agent:
    build:
      context: .
      args:
        # Preenchido pelo install.sh. Sem ele a imagem nao sabe a propria
        # versao e o verificador de atualizacao diz isso, em vez de mentir.
        CHECKPOINT_REV: "${CHECKPOINT_REV:-desconhecido}"
    environment:
      # O id registrado no Agent Index. Sem ele o reporter fica parado de
      # propósito, em vez de adivinhar um nome. Preenchido quando a ideia
      # estiver travada e o agente for registrado.
      AGENT_ID: "${AGENT_ID:-}"
      # O container nasce em UTC. Sem isto, "sua reunião é às 12h" sai errado
      # para qualquer pessoa fora do meridiano de Greenwich — e o horário do
      # cutucão automático também. Ajuste no .env para o seu fuso.
      TZ: "${TZ:-UTC}"
      # OPCIONAL, e desligado por padrão. Liga a skill `contribute`: o agente
      # trabalha numa cópia própria e abre um Pull Request para você revisar.
      # Vazio nos dois = a capacidade não existe nesta instalação, e o agente
      # diz isso em vez de tentar.
      #
      # CONTRIB_REPOS é a lista do que ele pode tocar, `dono/repo` separados por
      # vírgula. Não é lida do ambiente pelo script: o boot a copia para um
      # arquivo root-owned em /opt, porque um turno do agente consegue chamar um
      # script com o ambiente que quiser — e aí a lista deixaria de ser trava.
      CONTRIB_REPOS: "${CONTRIB_REPOS:-}"
      # Um PAT do GitHub. Use um FINE-GRAINED limitado aos repositórios acima,
      # com Contents: read/write e Pull requests: read/write. Nada além disso.
      CHECKPOINT_GH_TOKEN: "${CHECKPOINT_GH_TOKEN:-}"
    # A credencial que o `plow-agents mint <linha>` escreveu, carregada como
    # AMBIENTE — que é como a plataforma passou a entregá-la.
    #
    # Era um bind em `/var/lib/plow/credentials.host:ro`, e a imagem base
    # promovia o arquivo para o caminho final. **A base parou de promover** nas
    # versões de 15 e 16/09, e o resultado foi o pior tipo de falha: o container
    # sobe, fica `Up`, e sessenta segundos depois o `plow-init` parkeia com
    # "no PLOW_API_BASE in the environment and no credential at
    # /var/lib/plow/credentials". O agente não responde e nada no chat diz por
    # quê — ficou assim por horas em 18/09.
    #
    # Agora é igual ao `compose.yml` que a própria Plow publica, e o arquivo é
    # literalmente um dotenv (`PLOW_API_BASE=`, `PLOW_AGENT_TOKEN=`). De quebra,
    # `PLOW_CREDENTIALS` deixa apontar para fora do checkout, e aí um
    # `docker compose down -v` não leva a credencial junto.
    #
    # Um detalhe que melhora: com `env_file` um arquivo ausente faz o compose
    # falhar na hora, com o nome do arquivo. O bind criava um DIRETÓRIO vazio no
    # lugar e o erro só aparecia sessenta segundos depois, falando de credencial.
    env_file: ${PLOW_CREDENTIALS:-./plow-credentials}
    volumes:
      # A pasta que contém seus projetos, SOMENTE LEITURA. É a única coisa que
      # este agente precisa para funcionar — não há OAuth, token nem conta.
      # Aponte para a pasta que contém os projetos, não para um projeto só.
      # O alvo e variavel porque uma instalacao com MAIS DE UMA pasta nao pode
      # montar nenhuma delas em /projects: o bind ficaria somente leitura e o
      # Docker nao conseguiria criar /projects/<nome> dentro dele. Nesse caso o
      # install.sh escreve CODE_TARGET=/projects/<nome> e todas descem um nivel.
      # Vazio ou ausente (uma pasta so) mantem o comportamento antigo.
      - ${CODE_DIR:-./projects}:${CODE_TARGET:-/projects}:ro
      # A home do agente, preservada entre up/down para manter sessões e setup.
      - agent-home:/var/lib/hermes
      # Onde a skill `contribute` clona e edita. Volume separado, e FORA da home
      # de propósito: aqui entra código clonado de fora, que o agente escreve e
      # ninguém executa. Longe de $HERMES_HOME/scripts, que é o único lugar
      # gravável de onde o runtime roda coisa sozinho.
      - agent-work:/var/lib/checkpoint-work
    # Sem isto o agente nao volta sozinho depois que a maquina reinicia: fica
    # morto e em silencio ate alguem rodar `docker compose up` de novo, e nada
    # no celular do dono diz que ele parou. `unless-stopped`, nao `always`,
    # para nao desfazer um `docker compose stop` deliberado.
    restart: unless-stopped
    # O agente salva a sessão no SIGTERM e o supervisor dele espera 30s; o
    # prazo do Docker tem que ficar fora desse.
    stop_grace_period: 35s

volumes:
  agent-home:
  agent-work:
