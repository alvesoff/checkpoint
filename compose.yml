services:
  agent:
    build: .
    environment:
      # O id registrado no Agent Index. Sem ele o reporter fica parado de
      # propósito, em vez de adivinhar um nome. Preenchido quando a ideia
      # estiver travada e o agente for registrado.
      AGENT_ID: "${AGENT_ID:-}"
      # O container nasce em UTC. Sem isto, "sua reunião é às 12h" sai errado
      # para qualquer pessoa fora do meridiano de Greenwich — e o horário do
      # cutucão automático também. Ajuste no .env para o seu fuso.
      TZ: "${TZ:-UTC}"
    volumes:
      # `.host`, não o caminho que o agente lê: um bind carrega a dona e o modo
      # desta máquina, e a imagem copia o arquivo para o lugar certo como root.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # A pasta que contém seus projetos, SOMENTE LEITURA. É a única coisa que
      # este agente precisa para funcionar — não há OAuth, token nem conta.
      # Aponte para a pasta que contém os projetos, não para um projeto só.
      # O alvo e variavel porque uma instalacao com MAIS DE UMA pasta nao pode
      # montar nenhuma delas em /projects: o bind ficaria somente leitura e o
      # Docker nao conseguiria criar /projects/<nome> dentro dele. Nesse caso o
      # install.sh escreve CODE_TARGET=/projects/<nome> e todas descem um nivel.
      # Vazio ou ausente (uma pasta so) mantem o comportamento antigo.
      - ${CODE_DIR:-./projects}:${CODE_TARGET:-/projects}:ro
      # A home do agente, preservada entre up/down para manter sessões e setup.
      - agent-home:/var/lib/hermes
    # O agente salva a sessão no SIGTERM e o supervisor dele espera 30s; o
    # prazo do Docker tem que ficar fora desse.
    stop_grace_period: 35s

volumes:
  agent-home:
